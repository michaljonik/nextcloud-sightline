<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-label="Anna searches for beach. The service ranks candidates from every storage mounted for Anna, including all of Bartek's storage because he shared one folder with her. Nextcloud then checks each candidate as Anna and drops the ones she cannot open, so she sees three photos.">
  <title>Who sees what</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .m { fill: #59636e; }
    .b { font-weight: 600; }
    .step { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .nc { fill: #eef6fc; stroke: #b6dcf3; stroke-width: 1.5; }
    .svc { fill: #f6f2ff; stroke: #d6c6f7; stroke-width: 1.5; }
    .nch { fill: #0a6fa8; }
    .svch { fill: #6f42c1; }
    .chip { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .chipshared { fill: #ffffff; stroke: #1a7f37; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .off { opacity: 0.45; }
    .ok { fill: #eaf7ee; stroke: #1a7f37; stroke-width: 1.5; }
    .okt { fill: #1a7f37; }
    .okl { stroke: #1a7f37; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .no { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .nol { stroke: #cf222e; stroke-width: 2.4; fill: none; stroke-linecap: round; }
    .rank { fill: #6f42c1; }
    .rankt { fill: #ffffff; font-weight: 700; }
    .ln { stroke: #6e7781; stroke-width: 1.8; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .m, .step { fill: #9198a1; }
      .box, .chip { fill: #161b22; stroke: #3d444d; }
      .nc { fill: #0b2233; stroke: #1f5b80; }
      .svc { fill: #1f1733; stroke: #5a3f99; }
      .nch { fill: #58b5ea; }
      .svch { fill: #b392f0; }
      .chipshared { fill: #161b22; stroke: #3fb950; }
      .ok { fill: #0f2a19; stroke: #2ea043; }
      .okt { fill: #3fb950; }
      .okl { stroke: #3fb950; }
      .no { fill: #0d1117; stroke: #3d444d; }
      .nol { stroke: #f85149; }
      .rank { fill: #b392f0; }
      .rankt { fill: #0d1117; }
      .ln { stroke: #8b949e; }
      .ah { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="510" rx="14"/>

  <text class="b" x="30" y="50" font-size="20">Anna searches for “beach”</text>
  <text class="m" x="30" y="73" font-size="14">Bartek has shared one folder with her, Holidays. Nothing else of his.</text>

  <!-- Step 1: the index -->
  <text class="step" x="30" y="115">1 · IN THE INDEX</text>

  <rect class="nc" x="30" y="128" width="220" height="62" rx="8"/>
  <text class="b" x="46" y="153" font-size="14.5">Anna’s storage</text>
  <text class="m" x="46" y="174" font-size="12.5">her own photos</text>

  <rect class="nc" x="30" y="204" width="220" height="122" rx="8"/>
  <text class="b" x="46" y="229" font-size="14.5">Bartek’s storage</text>
  <rect class="chipshared" x="46" y="242" width="188" height="30" rx="6"/>
  <text x="58" y="262" font-size="13">Holidays <tspan class="okt">· shared</tspan></text>
  <rect class="chip" x="46" y="282" width="188" height="30" rx="6"/>
  <text x="58" y="302" font-size="13">Private</text>

  <g class="off">
    <rect class="nc" x="30" y="340" width="220" height="48" rx="8"/>
    <text class="b" x="46" y="369" font-size="14.5">Celina’s storage</text>
  </g>
  <text class="m" x="30" y="408" font-size="12.5">not mounted for Anna: filtered out</text>

  <!-- storage filter bracket -->
  <polyline class="ln" points="258,130 268,130 268,324 258,324"/>
  <line class="ln" x1="268" y1="227" x2="338" y2="227" marker-end="url(#arrow)"/>
  <text class="b" x="303" y="207" font-size="12.5" text-anchor="middle">storage</text>
  <text class="b" x="303" y="221" font-size="12.5" text-anchor="middle">filter</text>

  <!-- Step 2: service ranks -->
  <text class="step" x="340" y="115">2 · THE SERVICE RANKS</text>
  <rect class="svc" x="340" y="128" width="270" height="270" rx="10"/>
  <g font-size="14">
    <circle class="rank" cx="368" cy="160" r="11"/><text class="rankt" x="368" y="164.5" font-size="12" text-anchor="middle">1</text>
    <text class="b" x="390" y="165">file 4182</text><text class="m" x="594" y="165" font-size="12.5" text-anchor="end">Bartek’s storage</text>
    <circle class="rank" cx="368" cy="212" r="11"/><text class="rankt" x="368" y="216.5" font-size="12" text-anchor="middle">2</text>
    <text class="b" x="390" y="217">file 5307</text><text class="m" x="594" y="217" font-size="12.5" text-anchor="end">Bartek’s storage</text>
    <circle class="rank" cx="368" cy="264" r="11"/><text class="rankt" x="368" y="268.5" font-size="12" text-anchor="middle">3</text>
    <text class="b" x="390" y="269">file 1290</text><text class="m" x="594" y="269" font-size="12.5" text-anchor="end">Anna’s storage</text>
    <circle class="rank" cx="368" cy="316" r="11"/><text class="rankt" x="368" y="320.5" font-size="12" text-anchor="middle">4</text>
    <text class="b" x="390" y="321">file 5311</text><text class="m" x="594" y="321" font-size="12.5" text-anchor="end">Bartek’s storage</text>
    <circle class="rank" cx="368" cy="368" r="11"/><text class="rankt" x="368" y="372.5" font-size="12" text-anchor="middle">5</text>
    <text class="b" x="390" y="373">file 1302</text><text class="m" x="594" y="373" font-size="12.5" text-anchor="end">Anna’s storage</text>
  </g>

  <!-- arrows into step 3 -->
  <line class="ln" x1="612" y1="160" x2="676" y2="160" marker-end="url(#arrow)"/>
  <line class="ln" x1="612" y1="212" x2="676" y2="212" marker-end="url(#arrow)"/>
  <line class="ln" x1="612" y1="264" x2="676" y2="264" marker-end="url(#arrow)"/>
  <line class="ln" x1="612" y1="316" x2="676" y2="316" marker-end="url(#arrow)"/>
  <line class="ln" x1="612" y1="368" x2="676" y2="368" marker-end="url(#arrow)"/>

  <!-- Step 3: Nextcloud checks as Anna -->
  <text class="step" x="680" y="115">3 · NEXTCLOUD CHECKS AS ANNA</text>
  <g font-size="14">
    <rect class="ok" x="680" y="141" width="290" height="38" rx="8"/>
    <polyline class="okl" points="697,160 703,166 714,153"/>
    <text class="b" x="726" y="165">Holidays/beach.jpg</text><text class="okt" x="956" y="165" font-size="12.5" text-anchor="end">shared</text>

    <rect class="no" x="680" y="193" width="290" height="38" rx="8"/>
    <line class="nol" x1="699" y1="206" x2="711" y2="218"/><line class="nol" x1="711" y1="206" x2="699" y2="218"/>
    <text class="m" x="726" y="217">dropped</text><text class="m" x="956" y="217" font-size="12.5" text-anchor="end">Anna can’t open it</text>

    <rect class="ok" x="680" y="245" width="290" height="38" rx="8"/>
    <polyline class="okl" points="697,264 703,270 714,257"/>
    <text class="b" x="726" y="269">Photos/sea.jpg</text><text class="okt" x="956" y="269" font-size="12.5" text-anchor="end">her own</text>

    <rect class="no" x="680" y="297" width="290" height="38" rx="8"/>
    <line class="nol" x1="699" y1="310" x2="711" y2="322"/><line class="nol" x1="711" y1="310" x2="699" y2="322"/>
    <text class="m" x="726" y="321">dropped</text><text class="m" x="956" y="321" font-size="12.5" text-anchor="end">Anna can’t open it</text>

    <rect class="ok" x="680" y="349" width="290" height="38" rx="8"/>
    <polyline class="okl" points="697,368 703,374 714,361"/>
    <text class="b" x="726" y="373">Photos/harbour.jpg</text><text class="okt" x="956" y="373" font-size="12.5" text-anchor="end">her own</text>
  </g>

  <!-- not a full page: fetch more -->
  <polyline class="ln" points="720,389 720,424 475,424 475,402" marker-end="url(#arrow)"/>
  <text class="m" x="598" y="444" font-size="12.5" text-anchor="middle">page not full? ask for the next candidates</text>
  <text class="okt b" x="970" y="428" font-size="16" text-anchor="end">Anna sees 3 photos</text>

  <!-- footer -->
  <line x1="30" y1="466" x2="970" y2="466" class="ln" stroke-width="1" opacity="0.35"/>
  <text x="500" y="492" font-size="14" text-anchor="middle"><tspan class="m">The storage filter keeps results relevant. </tspan><tspan class="b">Nextcloud’s own access check keeps them private.</tspan></text>
</svg>
