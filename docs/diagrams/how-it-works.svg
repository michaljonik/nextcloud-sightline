<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="How Sightline works. Nextcloud sends preview images with file IDs to sightline-embed, which turns them into vectors. A search query goes to the same service, which returns the closest file IDs; Nextcloud then keeps only the photos the searching user can open.">
  <title>How Sightline works</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .m { fill: #59636e; }
    .b { font-weight: 600; }
    .lane { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .nc { fill: #eef6fc; stroke: #b6dcf3; stroke-width: 1.5; }
    .svc { fill: #f6f2ff; stroke: #d6c6f7; stroke-width: 1.5; }
    .nch { fill: #0a6fa8; }
    .svch { fill: #6f42c1; }
    .ok { fill: #eaf7ee; stroke: #1a7f37; stroke-width: 2; }
    .okt { fill: #1a7f37; }
    .pill { fill: #ffffff; stroke: #0a6fa8; stroke-width: 1.5; }
    .ln { stroke: #6e7781; stroke-width: 1.8; fill: none; }
    .ah { fill: #6e7781; }
    .cell { fill: #6f42c1; }
    .halo { stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; paint-order: stroke; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .m, .lane { fill: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .nc { fill: #0b2233; stroke: #1f5b80; }
      .svc { fill: #1f1733; stroke: #5a3f99; }
      .nch { fill: #58b5ea; }
      .svch { fill: #b392f0; }
      .ok { fill: #0f2a19; stroke: #2ea043; }
      .okt { fill: #3fb950; }
      .pill { fill: #161b22; stroke: #58b5ea; }
      .ln { stroke: #8b949e; }
      .ah { fill: #8b949e; }
      .cell { fill: #b392f0; }
      .halo { stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="540" rx="14"/>

  <!-- Regions -->
  <rect class="nc" x="20" y="20" width="460" height="440" rx="12"/>
  <text class="nch b" x="40" y="54" font-size="20">Nextcloud</text>
  <text class="m" x="40" y="76" font-size="13.5">knows users, files and permissions</text>

  <rect class="svc" x="600" y="20" width="380" height="440" rx="12"/>
  <text class="svch b" x="620" y="54" font-size="20">sightline-embed</text>
  <text class="m" x="620" y="76" font-size="13.5">knows file IDs and vectors, nothing else</text>

  <!-- Lane: indexing -->
  <text class="lane" x="40" y="112">INDEXING · IN THE BACKGROUND</text>

  <rect class="box" x="40" y="124" width="130" height="60" rx="8"/>
  <text class="b" x="105" y="150" font-size="15" text-anchor="middle">Photo saved</text>
  <text class="m" x="105" y="170" font-size="12.5" text-anchor="middle">upload, sync, scan</text>

  <rect class="box" x="195" y="124" width="95" height="60" rx="8"/>
  <text class="b" x="242.5" y="150" font-size="15" text-anchor="middle">Queue</text>
  <text class="m" x="242.5" y="170" font-size="12.5" text-anchor="middle">file ID only</text>

  <rect class="box" x="315" y="124" width="145" height="60" rx="8"/>
  <text class="b" x="387.5" y="150" font-size="15" text-anchor="middle">Preview</text>
  <text class="m" x="387.5" y="170" font-size="12.5" text-anchor="middle">1024 px image</text>

  <line class="ln" x1="170" y1="154" x2="193" y2="154" marker-end="url(#arrow)"/>
  <line class="ln" x1="290" y1="154" x2="313" y2="154" marker-end="url(#arrow)"/>
  <line class="ln" x1="460" y1="154" x2="618" y2="154" marker-end="url(#arrow)"/>
  <text class="b halo" x="540" y="128" font-size="13" text-anchor="middle">preview image</text>
  <text class="b halo" x="540" y="144" font-size="13" text-anchor="middle">+ file ID</text>

  <rect class="box" x="620" y="124" width="150" height="60" rx="8"/>
  <text class="b" x="695" y="150" font-size="15" text-anchor="middle">Image encoder</text>
  <text class="m" x="695" y="170" font-size="12.5" text-anchor="middle">photo → vector</text>
  <line class="ln" x1="770" y1="154" x2="808" y2="154" marker-end="url(#arrow)"/>

  <!-- Lane: search -->
  <text class="lane" x="40" y="232">SEARCH</text>

  <rect class="pill" x="40" y="246" width="250" height="56" rx="28"/>
  <circle cx="66" cy="271" r="7" fill="none" class="ln"/>
  <line class="ln" x1="71" y1="276" x2="77" y2="282"/>
  <text x="90" y="279" font-size="16">dog in the forest</text>

  <line class="ln" x1="290" y1="274" x2="618" y2="274" marker-end="url(#arrow)"/>
  <text class="b halo" x="540" y="248" font-size="13" text-anchor="middle">query text</text>
  <text class="b halo" x="540" y="264" font-size="13" text-anchor="middle">+ storage IDs</text>

  <rect class="box" x="620" y="244" width="150" height="60" rx="8"/>
  <text class="b" x="695" y="270" font-size="15" text-anchor="middle">Text encoder</text>
  <text class="m" x="695" y="290" font-size="12.5" text-anchor="middle">query → vector</text>
  <line class="ln" x1="770" y1="274" x2="808" y2="274" marker-end="url(#arrow)"/>
  <!-- Vector store -->
  <rect class="box" x="810" y="124" width="150" height="306" rx="8"/>
  <text class="b" x="885" y="150" font-size="15" text-anchor="middle">Vector store</text>
  <text class="m" x="885" y="170" font-size="12.5" text-anchor="middle">SQLite</text>
  <g font-size="12" class="m">
    <text class="m" x="826" y="210">4182</text>
    <text class="m" x="826" y="236">4190</text>
    <text class="m" x="826" y="262">5307</text>
    <text class="m" x="826" y="288">5311</text>
    <text class="m" x="826" y="314">1290</text>
    <text class="m" x="826" y="340">1302</text>
    <text class="m" x="826" y="366">7718</text>
    <text class="m" x="826" y="392">7720</text>
  </g>
  <g class="cell">
    <rect x="866" y="200" width="10" height="11" rx="2" opacity="0.9"/><rect x="880" y="200" width="10" height="11" rx="2" opacity="0.4"/><rect x="894" y="200" width="10" height="11" rx="2" opacity="0.7"/><rect x="908" y="200" width="10" height="11" rx="2" opacity="0.25"/><rect x="922" y="200" width="10" height="11" rx="2" opacity="0.6"/>
    <rect x="866" y="226" width="10" height="11" rx="2" opacity="0.3"/><rect x="880" y="226" width="10" height="11" rx="2" opacity="0.8"/><rect x="894" y="226" width="10" height="11" rx="2" opacity="0.5"/><rect x="908" y="226" width="10" height="11" rx="2" opacity="0.9"/><rect x="922" y="226" width="10" height="11" rx="2" opacity="0.2"/>
    <rect x="866" y="252" width="10" height="11" rx="2" opacity="0.6"/><rect x="880" y="252" width="10" height="11" rx="2" opacity="0.2"/><rect x="894" y="252" width="10" height="11" rx="2" opacity="0.9"/><rect x="908" y="252" width="10" height="11" rx="2" opacity="0.5"/><rect x="922" y="252" width="10" height="11" rx="2" opacity="0.7"/>
    <rect x="866" y="278" width="10" height="11" rx="2" opacity="0.8"/><rect x="880" y="278" width="10" height="11" rx="2" opacity="0.6"/><rect x="894" y="278" width="10" height="11" rx="2" opacity="0.2"/><rect x="908" y="278" width="10" height="11" rx="2" opacity="0.7"/><rect x="922" y="278" width="10" height="11" rx="2" opacity="0.4"/>
    <rect x="866" y="304" width="10" height="11" rx="2" opacity="0.2"/><rect x="880" y="304" width="10" height="11" rx="2" opacity="0.9"/><rect x="894" y="304" width="10" height="11" rx="2" opacity="0.4"/><rect x="908" y="304" width="10" height="11" rx="2" opacity="0.3"/><rect x="922" y="304" width="10" height="11" rx="2" opacity="0.8"/>
    <rect x="866" y="330" width="10" height="11" rx="2" opacity="0.5"/><rect x="880" y="330" width="10" height="11" rx="2" opacity="0.3"/><rect x="894" y="330" width="10" height="11" rx="2" opacity="0.8"/><rect x="908" y="330" width="10" height="11" rx="2" opacity="0.6"/><rect x="922" y="330" width="10" height="11" rx="2" opacity="0.3"/>
    <rect x="866" y="356" width="10" height="11" rx="2" opacity="0.9"/><rect x="880" y="356" width="10" height="11" rx="2" opacity="0.5"/><rect x="894" y="356" width="10" height="11" rx="2" opacity="0.3"/><rect x="908" y="356" width="10" height="11" rx="2" opacity="0.2"/><rect x="922" y="356" width="10" height="11" rx="2" opacity="0.9"/>
    <rect x="866" y="382" width="10" height="11" rx="2" opacity="0.4"/><rect x="880" y="382" width="10" height="11" rx="2" opacity="0.7"/><rect x="894" y="382" width="10" height="11" rx="2" opacity="0.6"/><rect x="908" y="382" width="10" height="11" rx="2" opacity="0.8"/><rect x="922" y="382" width="10" height="11" rx="2" opacity="0.5"/>
  </g>
  <text class="m" x="885" y="418" font-size="12" text-anchor="middle">file ID → 512 numbers</text>

  <!-- Results back -->
  <line class="ln" x1="810" y1="397" x2="462" y2="397" marker-end="url(#arrow)"/>
  <text class="b halo" x="540" y="373" font-size="13" text-anchor="middle">closest file IDs</text>
  <text class="b halo" x="540" y="389" font-size="13" text-anchor="middle">(the reply)</text>

  <rect class="ok" x="300" y="364" width="160" height="66" rx="8"/>
  <text class="okt b" x="380" y="389" font-size="15" text-anchor="middle">Access check</text>
  <text class="m" x="380" y="407" font-size="12.5" text-anchor="middle">can this user</text>
  <text class="m" x="380" y="422" font-size="12.5" text-anchor="middle">open the file?</text>

  <line class="ln" x1="300" y1="397" x2="272" y2="397" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="364" width="230" height="66" rx="8"/>
  <text class="b" x="155" y="389" font-size="15" text-anchor="middle">“Photos by content”</text>
  <text class="m" x="155" y="407" font-size="12.5" text-anchor="middle">in the search bar, only files</text>
  <text class="m" x="155" y="422" font-size="12.5" text-anchor="middle">this user can already open</text>

  <!-- Footer -->
  <text x="500" y="503" font-size="14" text-anchor="middle"><tspan class="b">Stays in Nextcloud:</tspan><tspan class="m"> user names, file paths, original files, Nextcloud credentials.</tspan></text>
</svg>
