[project]
name = "sightline-embed"
version = "0.0.1"
description = "Embedding service for Sightline, semantic photo search for Nextcloud"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "numpy>=2.3",
    "onnxruntime>=1.23",
    "pillow>=12.0",
    "pillow-heif>=1.1",
    "tokenizers>=0.22",
    "sqlite-vec==0.1.9",
    "huggingface-hub>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
]

[project.scripts]
sightline-embed = "sightline_embed.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
