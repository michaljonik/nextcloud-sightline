name: Release

# Push a tag vX.Y.Z whose version matches app/appinfo/info.xml and has a section in
# app/CHANGELOG.md. This publishes:
# - a GitHub release with the app archive sightline-X.Y.Z.tar.gz,
# - the sightline-embed image ghcr.io/<owner>/sightline-embed:X.Y.Z and :latest,
# - the archive to apps.nextcloud.com, only when the APPSTORE_KEY (the app's private key,
#   PEM) and APPSTORE_TOKEN secrets are set.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  app:
    name: App archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against info.xml
        id: version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' app/appinfo/info.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match info.xml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: scripts/package-app.sh build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' app/CHANGELOG.md > build/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/sightline-${{ steps.version.outputs.version }}.tar.gz" --notes-file build/notes.md --verify-tag
      - name: Upload to the Nextcloud app store
        env:
          APPSTORE_KEY: ${{ secrets.APPSTORE_KEY }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          ARCHIVE: build/sightline-${{ steps.version.outputs.version }}.tar.gz
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sightline-${{ steps.version.outputs.version }}.tar.gz
        run: |
          if [ -z "$APPSTORE_KEY" ] || [ -z "$APPSTORE_TOKEN" ]; then
            echo "APPSTORE_KEY or APPSTORE_TOKEN not set; skipping the app store"
            exit 0
          fi
          printf '%s\n' "$APPSTORE_KEY" > "$RUNNER_TEMP/sightline.key"
          signature=$(openssl dgst -sha512 -sign "$RUNNER_TEMP/sightline.key" "$ARCHIVE" | openssl base64 -A)
          rm "$RUNNER_TEMP/sightline.key"
          jq -n --arg download "$DOWNLOAD" --arg signature "$signature" \
            '{download: $download, signature: $signature, nightly: false}' |
          curl -sSf -X POST https://apps.nextcloud.com/api/v1/apps/releases \
            -H "Authorization: Token $APPSTORE_TOKEN" -H "Content-Type: application/json" --data @-

  image:
    name: sightline-embed image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/sightline-embed
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: embed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
