# Local development environment: Nextcloud 33 + Postgres, with ../app mounted as the
# sightline app. sightline-embed runs on the host (see embed/README.md) and is reached
# from the container as host.docker.internal.
#
#   docker compose -f dev/compose.yaml up -d
#   open http://localhost:8080   (admin / sightline-dev-admin, local only)
#
# Photos uploaded here live in the `html` volume, never in the repository.
name: sightline-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/postgresql/data

  nextcloud:
    image: nextcloud:33-apache
    ports:
      - "127.0.0.1:8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: sightline-dev-admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - html:/var/www/html
      - ../app:/var/www/html/custom_apps/sightline
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

volumes:
  db:
  html:
